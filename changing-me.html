
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Changing Me</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --teal:#4ecdc4;--lemon:#eef000;--coral:#ff6b6b;--navy:#1a2a4a;
  --text:#1a2a4a;--muted:#6a7a8a;--surface:#f0f4f8;--card:#ffffff;--border:rgba(0,0,0,0.08);
}
html,body{height:100%;background:var(--surface);color:var(--text);font-family:'Noto Sans JP',sans-serif;overscroll-behavior:none;}
.screen{display:none;min-height:100vh;}
.screen.active{display:block;}

/* HEADER */
.sky-header{position:relative;width:100%;height:160px;overflow:hidden;background:#b0c4d8;}
.sky-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
.sky-img.active{display:block;}
.header-overlay{position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,0,0,0.18) 0%,rgba(0,0,0,0.05) 60%,rgba(0,0,0,0.22) 100%);}
.header-top{position:absolute;top:14px;left:18px;font-size:.52rem;letter-spacing:.45em;color:rgba(255,255,255,0.8);font-weight:300;line-height:1.8;text-transform:uppercase;}
.header-title{position:absolute;bottom:30px;left:16px;line-height:1;}
.header-title .changing{font-family:'Kalam',cursive;font-size:2rem;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.3);}
.header-title .me{font-family:'Kalam',cursive;font-size:2.4rem;color:var(--lemon);text-shadow:0 2px 8px rgba(0,0,0,0.3);}
.header-sub{position:absolute;bottom:10px;right:16px;text-align:right;font-size:.68rem;color:rgba(255,255,255,0.9);line-height:1.7;text-shadow:0 1px 4px rgba(0,0,0,0.4);}
.streak-wrap{position:absolute;top:14px;right:16px;}
.streak-pill{background:rgba(255,255,255,0.2);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.35);border-radius:20px;padding:5px 12px;font-size:.75rem;color:#fff;}

/* SETUP */
#setup-screen{padding:0 0 60px;}
.setup-body{padding:20px;}
.section-label{font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--teal);margin-bottom:10px;}
.task-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.task-row{display:flex;align-items:center;gap:8px;}
.task-row input[type=text]{flex:1;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:.95rem;font-family:inherit;outline:none;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.task-row input[type=text]:focus{border-color:var(--teal);}
.task-row input[type=text]::placeholder{color:#aab;}
.del-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,107,107,0.12);border:none;color:var(--coral);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.add-btn{width:100%;padding:12px;background:rgba(78,205,196,0.08);border:1px dashed rgba(78,205,196,0.4);border-radius:10px;color:var(--teal);font-size:.9rem;cursor:pointer;font-family:inherit;margin-bottom:20px;}
.start-btn{width:100%;padding:16px;border-radius:14px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--teal),#38b2ac);font-family:'Kalam',cursive;font-size:1.4rem;color:#fff;letter-spacing:2px;box-shadow:0 4px 16px rgba(78,205,196,0.35);}

/* TRACKER */
#tracker-screen{display:none;flex-direction:column;min-height:100vh;}
#tracker-screen.active{display:flex;}
.date-bar{padding:8px 20px 4px;font-size:.8rem;color:var(--muted);}
.progress-wrap{padding:4px 20px 10px;}
.progress-bar-bg{height:6px;background:#dde6ee;border-radius:3px;overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),#38b2ac);border-radius:3px;transition:width .4s;}
.pct-label{font-size:.75rem;color:var(--muted);margin-top:4px;text-align:right;}
.bubbles-area{flex:1;padding:8px 16px 0;display:flex;flex-wrap:wrap;gap:10px;align-content:center;justify-content:center;overflow:hidden;}
.bubble{border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s;-webkit-tap-highlight-color:transparent;flex-shrink:0;text-align:center;padding:8px;position:relative;}
.bubble:active{transform:scale(.92);}
.bubble.done{opacity:.28;transform:scale(.86);}
.bubble-text{font-size:.72rem;font-weight:700;color:#fff;line-height:1.25;word-break:break-all;max-width:88%;text-shadow:0 1px 4px rgba(0,0,0,0.4);}
.pop-particle{position:fixed;pointer-events:none;border-radius:50%;animation:popfly .6s ease-out forwards;}
@keyframes popfly{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0;}}
.bottom-bar{padding:12px 20px 28px;display:flex;flex-direction:column;gap:8px;}
.done-btn{padding:14px;border-radius:14px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--teal),#38b2ac);font-family:'Kalam',cursive;font-size:1.1rem;color:#fff;letter-spacing:1px;box-shadow:0 4px 14px rgba(78,205,196,0.3);}
.nav-row{display:flex;gap:8px;}
.nav-btn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--muted);font-size:.75rem;cursor:pointer;font-family:inherit;}
.nav-btn.active-tab{border-color:var(--teal);color:var(--teal);}

/* MEMO POPUP */
#memo-overlay{display:none;position:fixed;inset:0;z-index:1000;background:rgba(26,42,74,0.6);align-items:flex-end;justify-content:center;}
#memo-overlay.active{display:flex;}
.memo-sheet{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 40px;width:100%;max-width:480px;}
.memo-task-name{font-size:.75rem;letter-spacing:.2em;color:var(--teal);text-transform:uppercase;margin-bottom:6px;}
.memo-question{font-size:1.1rem;font-weight:700;color:var(--navy);margin-bottom:16px;}
.memo-input{width:100%;border:1px solid var(--border);border-radius:12px;padding:14px;font-size:.95rem;font-family:inherit;color:var(--text);outline:none;resize:none;background:#f8fafc;line-height:1.6;}
.memo-input:focus{border-color:var(--teal);}
.memo-btns{display:flex;gap:8px;margin-top:12px;}
.memo-save{flex:1;padding:14px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--teal),#38b2ac);color:#fff;font-size:.95rem;font-family:inherit;font-weight:700;}
.memo-skip{padding:14px 20px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--muted);font-size:.9rem;cursor:pointer;font-family:inherit;}

/* HISTORY */
#history-screen{padding:0 0 80px;}
.history-body{padding:16px 20px;}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.history-title{font-family:'Kalam',cursive;font-size:1.6rem;color:var(--teal);}
.back-btn{padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--muted);font-size:.8rem;cursor:pointer;}
.hist-mode-row{display:flex;gap:6px;margin-bottom:14px;}
.hist-mode-btn{flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--muted);font-size:.78rem;cursor:pointer;font-family:inherit;}
.hist-mode-btn.active{border-color:var(--teal);color:var(--teal);background:rgba(78,205,196,0.08);}
/* タスク別タブ */
.task-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
.task-tabs::-webkit-scrollbar{display:none;}
.task-tab{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;color:var(--muted);font-size:.78rem;cursor:pointer;font-family:inherit;white-space:nowrap;}
.task-tab.active{border-color:var(--teal);color:var(--teal);background:rgba(78,205,196,0.1);}
.chart-wrap{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
canvas{width:100%!important;}
/* ログリスト */
.log-list{display:flex;flex-direction:column;gap:8px;}
.log-item{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.log-top{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.log-date{font-size:.72rem;color:var(--muted);}
.log-tag{font-size:.68rem;padding:2px 8px;border-radius:20px;background:rgba(78,205,196,0.12);color:var(--teal);}
.log-memo{font-size:.88rem;color:var(--text);line-height:1.6;}
.log-no-memo{font-size:.82rem;color:#bbc;font-style:italic;}
/* 日別リスト */
.rec-list{display:flex;flex-direction:column;gap:8px;}
.rec-item{background:#fff;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.rec-date{text-align:center;min-width:36px;}
.rec-mo{font-size:.65rem;color:var(--muted);}
.rec-day{font-size:1.2rem;font-weight:700;line-height:1;color:var(--text);}
.rec-wd{font-size:.65rem;color:var(--muted);}
.rec-info{flex:1;}
.rec-tags{display:flex;flex-wrap:wrap;gap:4px;}
.rec-tag{font-size:.7rem;padding:2px 8px;border-radius:20px;background:#f0f4f8;color:var(--muted);}
.rec-tag.done{background:rgba(78,205,196,0.15);color:var(--teal);}
.rec-score{font-family:'Kalam',cursive;font-size:1.1rem;min-width:44px;text-align:right;}
.reset-wrap{margin-top:20px;}
.reset-btn{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,107,107,0.3);background:rgba(255,107,107,0.06);color:var(--coral);font-size:.85rem;cursor:pointer;font-family:inherit;}

/* MILESTONE */
#milestone-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(240,244,248,0.92);align-items:center;justify-content:center;flex-direction:column;padding:24px;}
#milestone-overlay.active{display:flex;}
.milestone-day{font-family:'Kalam',cursive;font-size:4rem;color:var(--teal);text-align:center;}
.milestone-msg{font-size:1.15rem;font-weight:700;text-align:center;color:var(--navy);margin-top:12px;line-height:1.7;padding:0 12px;}
.milestone-close{margin-top:28px;padding:14px 40px;border-radius:30px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--teal),#38b2ac);font-family:'Kalam',cursive;font-size:1.1rem;color:#fff;box-shadow:0 4px 14px rgba(78,205,196,0.35);}
.confetti{position:fixed;pointer-events:none;border-radius:2px;animation:cf .9s ease-out forwards;}
@keyframes cf{0%{transform:translate(0,0) rotate(0deg);opacity:1;}100%{transform:translate(var(--cx),var(--cy)) rotate(360deg);opacity:0;}}
</style>
</head>
<body>

<div id="setup-screen" class="screen active">
  <div class="sky-header">

    <img class="sky-img" id="sky-4h" src="6636.jpg" alt="">

<!-- TRACKER -->
<div id="tracker-screen" class="screen">
  <div class="sky-header">
    <img class="sky-img" id="sky2-3h30" src="6635.jpg" alt="">
    <img class="sky-img" id="sky2-4h" src="6636.jpg" alt="">
    <img class="sky-img" id="sky2-7h" src="6637.jpg" alt="">

  <div class="date-bar" id="date-bar"></div>
  <div class="progress-wrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog-fill" style="width:0%"></div></div>

      <button class="nav-btn active-tab" id="nav-today">TODAY</button>
      <button class="nav-btn" id="nav-history">HISTORY</button>

</div>

<!-- MEMO POPUP -->
<div id="memo-overlay">

<!-- HISTORY -->
<div id="history-screen" class="screen">
  <div class="sky-header" style="height:110px;">
    <img class="sky-img" id="sky3-3h30" src="6635.jpg" alt="">
    <img class="sky-img" id="sky3-4h" src="6636.jpg" alt="">
    <img class="sky-img" id="sky3-7h" src="6637.jpg" alt="">
    <img class="sky-img" id="sky3-16h" src="6638.jpg" alt="">
    <img class="sky-img" id="sky3-19h" src="6640.jpg" alt="">
    <img class="sky-img" id="sky3-22h" src="6639.jpg" alt="">
    <div class="header-overlay"></div>

<!-- MILESTONE -->
<div id="milestone-overlay">
  <div class="milestone-day" id="ms-day"></div>
  <div class="milestone-msg" id="ms-msg"></div>
  <button class="milestone-close" id="ms-close">Keep going ✨</button>
</div>

<script>
const STORE_KEY='changingme_v1';
const MILESTONES=[3,7,10,14,20,21,25,30,40,45,50,60,70,80,85,90,95,100];
const WEEKDAYS=['日','月','火','水','木','金','土'];
const BUBBLE_COLORS=[
  'linear-gradient(135deg,#4ecdc4,#2ab5ac)',
  'linear-gradient(135deg,#ff9a9e,#e07070)',
  'linear-gradient(135deg,#a8e6cf,#56c596)',
  'linear-gradient(135deg,#ffd89b,#f9b44e)',
  'linear-gradient(135deg,#a29bfe,#6c63ff)',
  'linear-gradient(135deg,#fd79a8,#e84393)',
  'linear-gradient(135deg,#74b9ff,#0984e3)',
  'linear-gradient(135deg,#55efc4,#00b894)',
  'linear-gradient(135deg,#fdcb6e,#e17055)',
  'linear-gradient(135deg,#81ecec,#4ecdc4)',
];
const DEFAULT_TASKS=['ストレッチ','寝る前に今日できたことを見直す','今日の自分をほめる'];

let taskList={};
let nextId=1;
let histMode='log';
let activeTaskTab='all';
let pendingMemoId=null;

function loadData(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{};}catch(e){return{};}}
function saveData(d){localStorage.setItem(STORE_KEY,JSON.stringify(d));}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}

// 時間帯→空画像
function getSkyId(prefix){
  const h=new Date().getHours(),m=new Date().getMinutes(),t=h*60+m;
  if(t>=210&&t<240)return prefix+'-3h30';
  if(t>=240&&t<420)return prefix+'-4h';
  if(t>=420&&t<960)return prefix+'-7h';
  if(t>=960&&t<1140)return prefix+'-16h';
  if(t>=1140&&t<1320)return prefix+'-19h';
  return prefix+'-22h';
}
function updateSkies(){
  ['sky','sky2','sky3'].forEach(p=>{
    document.querySelectorAll(`[id^="${p}-"]`).forEach(el=>el.classList.remove('active'));
    const t=document.getElementById(getSkyId(p));
    if(t)t.classList.add('active');
  });
}

// ===== SETUP =====
function initSetup(){
  updateSkies();
  const data=loadData(),today=todayStr();
  if(data[today]&&data[today].done){
    loadTodayFromRecord(data[today]);
    showScreen('tracker-screen');renderTracker();return;
  }
  const keys=Object.keys(data).filter(k=>k!=='__settings').sort();
  const lastKey=keys[keys.length-1];
  const lastTasks=lastKey&&data[lastKey].tasks?data[lastKey].tasks:[];
  taskList={};nextId=1;
  if(lastTasks.length>0){
    lastTasks.forEach(t=>{const id='t'+nextId++;taskList[id]={name:t.name,done:false};});
  }else{
    DEFAULT_TASKS.forEach(name=>{const id='t'+nextId++;taskList[id]={name,done:false};});
  }
  renderTaskList();
}

function renderTaskList(){
  const el=document.getElementById('task-list');el.innerHTML='';
  Object.entries(taskList).forEach(([id,t])=>{
    const row=document.createElement('div');row.className='task-row';
    const inp=document.createElement('input');inp.type='text';inp.placeholder='タスク名を入力';inp.value=t.name;
    inp.addEventListener('input',e=>{taskList[id].name=e.target.value;});
    const del=document.createElement('button');del.className='del-btn';del.textContent='×';
    del.addEventListener('click',()=>{if(Object.keys(taskList).length<=1)return;delete taskList[id];renderTaskList();});
    row.appendChild(inp);row.appendChild(del);el.appendChild(row);
  });
}

document.getElementById('add-btn').addEventListener('click',()=>{
  if(Object.keys(taskList).length>=10)return;
  const id='t'+nextId++;taskList[id]={name:'',done:false};renderTaskList();
  const inputs=document.querySelectorAll('.task-row input');
  if(inputs.length)inputs[inputs.length-1].focus();
});

document.getElementById('start-btn').addEventListener('click',()=>{
  Object.keys(taskList).forEach(id=>{if(!taskList[id].name.trim())delete taskList[id];});
  if(Object.keys(taskList).length===0){const id='t'+nextId++;taskList[id]={name:'デフォルトタスク',done:false};}
  showScreen('tracker-screen');renderTracker();
});

// ===== TRACKER =====
function renderTracker(){
  updateSkies();
  const d=new Date();
  document.getElementById('date-bar').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WEEKDAYS[d.getDay()]}）`;
  renderBubbles();updateProgress();updateStreak();
}

function renderBubbles(){
  const area=document.getElementById('bubbles-area');area.innerHTML='';
  const ids=Object.keys(taskList);const n=ids.length;
  if(!n)return;
  const areaW=area.offsetWidth||window.innerWidth-32;
  const areaH=area.offsetHeight||(window.innerHeight*0.48);
  const cols=n<=2?n:n<=4?2:n<=6?3:n<=8?4:5;
  const rows=Math.ceil(n/cols);
  const gap=10;
  const maxW=Math.floor((areaW-(cols-1)*gap)/cols);
  const maxH=Math.floor((areaH-(rows-1)*gap)/rows);
  const baseSize=Math.min(maxW,maxH,148);
  const patterns={
    1:[1.0],2:[1.0,0.85],3:[1.0,0.78,0.90],
    4:[1.0,0.78,0.88,0.68],
    5:[1.0,0.70,0.88,0.65,0.92],
    6:[0.95,0.72,0.88,0.65,0.82,0.78],
    7:[0.95,0.72,0.88,0.65,0.82,0.78,0.9],
    8:[0.9,0.70,0.85,0.62,0.80,0.75,0.88,0.68],
    9:[0.9,0.70,0.85,0.62,0.80,0.75,0.88,0.68,0.78],
    10:[0.88,0.68,0.82,0.60,0.78,0.72,0.86,0.65,0.76,0.70],
  };
  const pat=patterns[n]||[...Array(n)].map((_,i)=>[1.0,0.75,0.88][i%3]);
  ids.forEach((id,i)=>{
    const t=taskList[id];
    const sz=Math.max(60,Math.round(baseSize*pat[i]));
    const div=document.createElement('div');
    div.className='bubble'+(t.done?' done':'');
    div.style.cssText=`width:${sz}px;height:${sz}px;background:${BUBBLE_COLORS[i%BUBBLE_COLORS.length]};box-shadow:0 4px 16px rgba(0,0,0,0.18);`;
    div.dataset.id=id;
    const span=document.createElement('span');span.className='bubble-text';
    span.style.fontSize=sz<72?'.58rem':sz<92?'.65rem':'.73rem';
    span.textContent=t.name||'タスク';
    div.appendChild(span);
    div.addEventListener('click',()=>openMemo(id,div));
    area.appendChild(div);
  });
}

// ===== MEMO =====
function openMemo(id, el){
  if(taskList[id].done)return;
  pendingMemoId=id;
  document.getElementById('memo-task-name').textContent=taskList[id].name;
  document.getElementById('memo-input').value='';
  document.getElementById('memo-overlay').classList.add('active');
  setTimeout(()=>document.getElementById('memo-input').focus(),300);
}

function closeMemo(){
  document.getElementById('memo-overlay').classList.remove('active');
  pendingMemoId=null;
}

function saveMemoAndDone(memo){
  const id=pendingMemoId;if(!id)return;
  taskList[id].done=true;
  // メモをlocalStorageに保存
  const data=loadData();const today=todayStr();
  if(!data[today])data[today]={done:false,pct:0,tasks:[],memos:{}};
  if(!data[today].memos)data[today].memos={};
  data[today].memos[taskList[id].name]=memo;
  saveData(data);
  // バブルにdoneを反映
  const el=document.querySelector(`.bubble[data-id="${id}"]`);
  if(el){el.classList.add('done');popEffect(el);}
  updateProgress();
  closeMemo();
}

document.getElementById('memo-save').addEventListener('click',()=>{
  const memo=document.getElementById('memo-input').value.trim();
  saveMemoAndDone(memo);
});
document.getElementById('memo-skip').addEventListener('click',()=>{
  saveMemoAndDone('');
});
document.getElementById('memo-overlay').addEventListener('click',(e)=>{
  if(e.target===document.getElementById('memo-overlay'))closeMemo();
});

function popEffect(el){
  const rect=el.getBoundingClientRect();const cx=rect.left+rect.width/2;const cy=rect.top+rect.height/2;
  const colors=['#4ecdc4','#ff9a9e','#ffd89b','#a29bfe','#55efc4','#fdcb6e'];
  for(let i=0;i<12;i++){
    const p=document.createElement('div');p.className='pop-particle';
    const angle=(i/12)*Math.PI*2;const dist=40+Math.random()*60;
    p.style.cssText=`left:${cx}px;top:${cy}px;width:10px;height:10px;background:${colors[i%colors.length]};--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;`;
    document.body.appendChild(p);setTimeout(()=>p.remove(),700);
  }
}

function updateProgress(){
  const ids=Object.keys(taskList);const done=ids.filter(id=>taskList[id].done).length;
  const pct=ids.length?Math.round(done/ids.length*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('pct-label').textContent=pct+'%';
}

function updateStreak(){
  const data=loadData();const streak=calcStreak(data);
  document.getElementById('streak-badge').textContent=`🌿 ${streak}日連続`;
}

function calcStreak(data){
  const keys=Object.keys(data).filter(k=>k!=='__settings'&&data[k].done).sort().reverse();
  if(!keys.length)return 0;
  let streak=0;const today=new Date();today.setHours(0,0,0,0);
  for(let i=0;i<keys.length;i++){
    const d=parseD(keys[i]);d.setHours(0,0,0,0);
    if(Math.round((today-d)/86400000)===i)streak++;else break;
  }
  return streak;
}

document.getElementById('done-btn').addEventListener('click',()=>{
  const ids=Object.keys(taskList);const done=ids.filter(id=>taskList[id].done).length;
  const pct=ids.length?Math.round(done/ids.length*100):0;
  const data=loadData();const today=todayStr();
  if(!data[today])data[today]={memos:{}};
  data[today].done=true;data[today].pct=pct;
  data[today].tasks=ids.map(id=>({name:taskList[id].name,done:taskList[id].done}));
  saveData(data);
  const streak=calcStreak(data);checkMilestone(streak);
});

document.getElementById('nav-history').addEventListener('click',()=>{showScreen('history-screen');renderHistory();});
document.getElementById('nav-today').addEventListener('click',()=>{showScreen('tracker-screen');});
document.getElementById('nav-reset-today').addEventListener('click',()=>{
  if(confirm('今日の記録をリセットしますか？')){
    Object.keys(taskList).forEach(id=>{taskList[id].done=false;});renderBubbles();updateProgress();
  }
});
document.getElementById('back-btn').addEventListener('click',()=>{showScreen('tracker-screen');});

function loadTodayFromRecord(rec){
  taskList={};nextId=1;
  rec.tasks.forEach(t=>{const id='t'+nextId++;taskList[id]={name:t.name,done:t.done};});
}

// ===== MILESTONE =====
function checkMilestone(streak){
  if(!MILESTONES.includes(streak))return;
  document.getElementById('ms-day').textContent=streak+'日達成！';
  const msgs={
    3:'3日、続いた。それだけでもう十分すごい。',7:'1週間！続いた自分を褒めよう！',
    10:'10日目。もう"やる人"になってる。',14:'2週間。体が覚えはじめてる。',
    20:'20日。これ、本物の習慣かも。',21:'21日。科学的に習慣になった日。',
    25:'あと5日で、もうすぐ1ヶ月！素晴らしい✨️',30:'1ヶ月達成✨️もう あなたは、変わってる！',
    40:'40日。もう誰にも止められない。',45:'45日。折り返し超えた。本物だ。',
    50:'50日。自分との約束、守ってる。',60:'2ヶ月。これが新しい"普通"になった。',
    70:'70日。継続が、一番の才能。',80:'80日。ここまで来る人、ほとんどいない。',
    85:'85日。もうゴールが見えてる。',90:'3ヶ月。人生、変わってきてない？',
    95:'95日。あと5日、一緒に行こう。',
    100:'100日分の"あなた"が、今日のあなたをつくった！！本当におめでとう🎉'
  };
  document.getElementById('ms-msg').textContent=msgs[streak]||`${streak}日達成！`;
  document.getElementById('milestone-overlay').classList.add('active');
  fireConfetti(streak>=30?3:streak>=10?2:1);
}
document.getElementById('ms-close').addEventListener('click',()=>{document.getElementById('milestone-overlay').classList.remove('active');});

function fireConfetti(level){
  const colors=['#4ecdc4','#ff9a9e','#ffd89b','#a29bfe','#55efc4','#fdcb6e','#fff','#eef000'];
  const count=level===3?100:level===2?50:25;
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      const p=document.createElement('div');p.className='confetti';
      const sx=Math.random()*window.innerWidth,sy=Math.random()*window.innerHeight*0.5;
      const angle=Math.random()*Math.PI*2,dist=80+Math.random()*140;
      const w=6+Math.random()*8,h=4+Math.random()*6;
      p.style.cssText=`left:${sx}px;top:${sy}px;width:${w}px;height:${h}px;background:${colors[Math.floor(Math.random()*colors.length)]};--cx:${Math.cos(angle)*dist}px;--cy:${Math.sin(angle)*dist+60}px;`;
      document.body.appendChild(p);setTimeout(()=>p.remove(),1000);
    },Math.random()*1200);
  }
}

// ===== HISTORY =====
function renderHistory(){
  updateSkies();
  // モード切り替えボタン
  document.querySelectorAll('.hist-mode-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.mode===histMode);
  });
  if(histMode==='log'){
    document.getElementById('task-tabs').style.display='flex';
    document.getElementById('chart-wrap').style.display='none';
    document.getElementById('log-list').style.display='flex';
    document.getElementById('rec-list').style.display='none';
    renderLogMode();
  }else{
    document.getElementById('task-tabs').style.display='none';
    document.getElementById('chart-wrap').style.display='block';
    document.getElementById('log-list').style.display='none';
    document.getElementById('rec-list').style.display='flex';
    renderDailyMode();
  }
}

document.querySelectorAll('.hist-mode-btn').forEach(b=>{
  b.addEventListener('click',()=>{histMode=b.dataset.mode;renderHistory();});
});

// 行動ログモード
function renderLogMode(){
  const data=loadData();
  // 全タスク名収集
  const taskNames=new Set();
  Object.values(data).forEach(d=>{
    if(d.tasks)d.tasks.forEach(t=>{if(t.done)taskNames.add(t.name);});
  });
  // タブ描画
  const tabEl=document.getElementById('task-tabs');tabEl.innerHTML='';
  const allTab=document.createElement('button');
  allTab.className='task-tab'+(activeTaskTab==='all'?' active':'');
  allTab.textContent='すべて';allTab.dataset.task='all';
  allTab.addEventListener('click',()=>{activeTaskTab='all';renderLogMode();});
  tabEl.appendChild(allTab);
  [...taskNames].forEach(name=>{
    const btn=document.createElement('button');
    btn.className='task-tab'+(activeTaskTab===name?' active':'');
    btn.textContent=name;btn.dataset.task=name;
    btn.addEventListener('click',()=>{activeTaskTab=name;renderLogMode();});
    tabEl.appendChild(btn);
  });
  // ログ一覧
  const logEl=document.getElementById('log-list');logEl.innerHTML='';
  const allKeys=Object.keys(data).filter(k=>k!=='__settings').sort().reverse();
  let hasLog=false;
  allKeys.forEach(dateKey=>{
    const rec=data[dateKey];if(!rec||!rec.tasks)return;
    const memos=rec.memos||{};
    const d=parseD(dateKey);
    const dateStr=`${d.getMonth()+1}/${d.getDate()}（${WEEKDAYS[d.getDay()]}）`;
    rec.tasks.forEach(t=>{
      if(!t.done)return;
      if(activeTaskTab!=='all'&&activeTaskTab!==t.name)return;
      hasLog=true;
      const item=document.createElement('div');item.className='log-item';
      const memo=memos[t.name]||'';
      item.innerHTML=`<div class="log-top"><span class="log-date">${dateStr}</span><span class="log-tag">${t.name}</span></div>${memo?`<div class="log-memo">${memo}</div>`:`<div class="log-no-memo">メモなし</div>`}`;
      logEl.appendChild(item);
    });
  });
  if(!hasLog){
    logEl.innerHTML='<div style="color:#aab;font-size:.85rem;padding:20px 0;text-align:center;">まだ記録がありません</div>';
  }
}

// 日別モード
function renderDailyMode(){
  const data=loadData();
  const allKeys=Object.keys(data).filter(k=>k!=='__settings').sort();
  drawChart(allKeys,data);
  const recEl=document.getElementById('rec-list');recEl.innerHTML='';
  allKeys.slice().reverse().forEach(k=>{
    const r=data[k];if(!r)return;
    const d=parseD(k);const sc=r.pct>=80?'#4ecdc4':r.pct>=50?'#fdcb6e':'#ccc';
    const tags=r.tasks?r.tasks.map(t=>`<span class="rec-tag ${t.done?'done':''}">${t.done?'✓ ':''}${t.name}</span>`).join(''):'';
    const item=document.createElement('div');item.className='rec-item';
    item.innerHTML=`<div class="rec-date"><div class="rec-mo">${d.getMonth()+1}月</div><div class="rec-day">${d.getDate()}</div><div class="rec-wd">${WEEKDAYS[d.getDay()]}</div></div><div class="rec-info"><div class="rec-tags">${tags}</div></div><div class="rec-score" style="color:${sc}">${r.pct}%</div>`;
    recEl.appendChild(item);
  });
}

function drawChart(keys,data){
  const canvas=document.getElementById('hist-chart');const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth||300,H=140;canvas.width=W;canvas.height=H;
  ctx.clearRect(0,0,W,H);
  if(!keys.length){ctx.fillStyle='#aab';ctx.font='14px sans-serif';ctx.fillText('記録なし',W/2-30,H/2);return;}
  const vals=keys.map(k=>data[k]?.pct||0);
  const pad={l:24,r:8,t:8,b:26};
  const bw=Math.max(4,(W-pad.l-pad.r)/keys.length-4);
  for(let i=0;i<=4;i++){
    const y=pad.t+(H-pad.t-pad.b)*(1-i/4);
    ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(pad.l,y,W-pad.l-pad.r,1);
    ctx.fillStyle='#aab';ctx.font='10px sans-serif';ctx.fillText(i*25+'%',2,y+4);
  }
  keys.forEach((k,i)=>{
    const x=pad.l+(W-pad.l-pad.r)*i/keys.length+(W-pad.l-pad.r)/(keys.length*2)-bw/2;
    const bh=(vals[i]/100)*(H-pad.t-pad.b);const y=pad.t+(H-pad.t-pad.b)-bh;
    const grad=ctx.createLinearGradient(0,y,0,y+bh);
    grad.addColorStop(0,'#4ecdc4');grad.addColorStop(1,'#a8e6cf');
    ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(x,y,bw,bh,3);ctx.fill();
    const d=parseD(k);ctx.fillStyle='#aab';ctx.font='9px sans-serif';
    ctx.fillText(`${d.getMonth()+1}/${d.getDate()}`,x-2,H-4);
  });
}

document.getElementById('full-reset-btn').addEventListener('click',()=>{
  if(confirm('全ての記録を消します。\nこの操作は元に戻せません。本当にいいですか？')){
    localStorage.removeItem(STORE_KEY);taskList={};nextId=1;
    showScreen('setup-screen');initSetup();
  }
});

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  updateSkies();
}

window.addEventListener('resize',()=>{
  if(document.getElementById('tracker-screen').classList.contains('active'))renderBubbles();
});

initSetup();
</script>
