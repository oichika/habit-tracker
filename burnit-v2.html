<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BURN IT!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f0f1a;--surface:#1a1a2e;--card:#22223a;--border:rgba(255,255,255,0.08);
  --cyan:#00e5ff;--pink:#ff4db8;--orange:#ff9a3c;--yellow:#ffe234;--green:#39ff14;--purple:#c77dff;
  --text:#f0f0ff;--muted:#888aaa;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;overscroll-behavior:none;}
.screen{display:none;padding:0 0 40px;}
#setup-screen{min-height:100vh;}
#history-screen{min-height:100vh;}
.screen.active{display:block;}

/* ===== SETUP ===== */
#setup-screen{padding:24px 20px 60px;overflow-y:auto;}
.setup-header{text-align:center;padding:20px 0 28px;}
.setup-header .logo{font-family:'Nunito',sans-serif;font-size:2.6rem;font-weight:900;
  background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;}
.setup-header .sub{font-size:.75rem;color:var(--muted);margin-top:4px;letter-spacing:3px;text-transform:uppercase;}
.section-label{font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--cyan);margin-bottom:10px;}
.task-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.task-row{display:flex;align-items:center;gap:8px;}
.task-row input[type=text]{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;color:var(--text);font-size:.95rem;font-family:inherit;outline:none;}
.task-row input[type=text]:focus{border-color:var(--cyan);}
.task-row input[type=text]::placeholder{color:var(--muted);}
.del-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,77,184,0.15);border:none;
  color:var(--pink);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.add-btn{width:100%;padding:12px;background:rgba(0,229,255,0.08);border:1px dashed rgba(0,229,255,0.3);
  border-radius:10px;color:var(--cyan);font-size:.9rem;cursor:pointer;font-family:inherit;margin-bottom:24px;}
.back-to-today-btn{width:100%;padding:14px;border-radius:14px;border:1px solid var(--cyan);background:transparent;color:var(--cyan);font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:10px;}
.start-btn{width:100%;padding:18px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--cyan),var(--pink));
  font-family:'Nunito',sans-serif;font-size:1.4rem;font-weight:900;color:#0f0f1a;letter-spacing:2px;}

/* ===== TRACKER ===== */
#tracker-screen{display:none;flex-direction:column;height:100dvh;max-height:100dvh;overflow:hidden;}
#tracker-screen.active{display:flex;}
.tracker-header{padding:20px 20px 8px;display:flex;justify-content:space-between;align-items:center;}
.tracker-logo{font-family:'Nunito',sans-serif;font-size:1.5rem;font-weight:900;
  background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.streak-badge{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;
  font-size:.8rem;color:var(--yellow);}
.date-bar{padding:4px 20px 16px;font-size:.8rem;color:var(--muted);}
.progress-wrap{padding:0 20px 16px;}
.progress-bar-bg{height:6px;background:var(--card);border-radius:3px;overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:3px;transition:width .4s;}
.pct-label{font-size:.75rem;color:var(--muted);margin-top:6px;text-align:right;}
.bubbles-area{flex:1;padding:8px 16px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:center;justify-content:center;overflow:hidden;}
.bubble{position:relative;flex-shrink:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .12s,opacity .12s;}
.bubble:active{transform:scale(.91);}
.bubble.done{opacity:.28;transform:scale(.85);}
.bubble canvas{display:block;}
.bubble-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-weight:900;color:#fff;line-height:1.25;word-break:break-all;
  text-align:center;text-shadow:0 1px 5px rgba(0,0,0,0.55);pointer-events:none;
  width:80%;z-index:2;}
.pop-particle{position:fixed;pointer-events:none;border-radius:50%;animation:popfly .6s ease-out forwards;}
@keyframes popfly{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0;}}
.bottom-bar{padding:16px 20px 32px;display:flex;flex-direction:column;gap:10px;}
.done-btn{padding:16px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--cyan),var(--green));
  font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:900;color:#0f0f1a;letter-spacing:1px;}
.nav-row{display:flex;gap:8px;}
.nav-btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card);
  color:var(--muted);font-size:.8rem;cursor:pointer;font-family:inherit;}
.nav-btn.active-tab{border-color:var(--cyan);color:var(--cyan);}

/* ===== HISTORY ===== */
#history-screen{padding:20px 20px 80px;}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.history-title{font-family:'Nunito',sans-serif;font-size:1.4rem;font-weight:900;color:var(--cyan);}
.back-btn{padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:.8rem;cursor:pointer;}
.tab-row{display:flex;gap:6px;margin-bottom:20px;}
.tab-btn{flex:1;padding:10px 0;border-radius:8px;border:1px solid var(--border);background:var(--card);
  color:var(--muted);font-size:.8rem;cursor:pointer;font-family:inherit;}
.tab-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,0.08);}
.chart-wrap{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px;}
canvas{width:100%!important;}
.rec-list{display:flex;flex-direction:column;gap:8px;}
.rec-item{background:var(--card);border-radius:10px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;}
.rec-date{text-align:center;min-width:36px;}
.rec-mo{font-size:.65rem;color:var(--muted);}
.rec-day{font-size:1.2rem;font-weight:900;line-height:1;}
.rec-wd{font-size:.65rem;color:var(--muted);}
.rec-info{flex:1;}
.rec-tags{display:flex;flex-wrap:wrap;gap:4px;}
.rec-tag{font-size:.7rem;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,0.06);color:var(--muted);}
.rec-tag.done{background:rgba(0,229,255,0.15);color:var(--cyan);}
.rec-score{font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:900;min-width:44px;text-align:right;}
.reset-wrap{margin-top:24px;display:flex;flex-direction:column;gap:8px;}
.reset-btn{padding:12px;border-radius:10px;border:1px solid rgba(255,77,184,0.3);background:rgba(255,77,184,0.08);
  color:var(--pink);font-size:.85rem;cursor:pointer;font-family:inherit;}

/* ===== GOAL INPUT ===== */
.goal-wrap{margin-bottom:20px;}
.goal-label{font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px;}
.goal-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;color:var(--text);font-size:.95rem;font-family:inherit;outline:none;resize:none;line-height:1.6;}
.goal-input:focus{border-color:var(--cyan);}
.goal-input::placeholder{color:var(--muted);}
.goal-history-btn{background:none;border:none;color:var(--cyan);font-size:.78rem;cursor:pointer;
  padding:6px 0;font-family:inherit;display:flex;align-items:center;gap:4px;margin-top:4px;}
.goal-history-list{display:none;background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;margin-top:6px;max-height:180px;overflow-y:auto;}
.goal-history-list.open{display:block;}
.goal-history-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);}
.goal-history-item:last-child{border-bottom:none;}
.goal-history-date{font-size:.7rem;color:var(--muted);min-width:52px;padding-top:2px;}
.goal-history-text{font-size:.85rem;color:var(--text);line-height:1.5;}
.goal-history-text.current{color:var(--cyan);font-weight:700;}

/* ===== DONE POPUP ===== */
#done-popup{display:none;position:fixed;inset:0;z-index:8000;background:rgba(0,0,0,.7);
  align-items:center;justify-content:center;padding:24px;}
#done-popup.active{display:flex;}
.done-popup-card{background:linear-gradient(135deg,#1a1a2e,#22223a);border-radius:24px;padding:32px 24px;
  text-align:center;max-width:320px;width:100%;border:1px solid rgba(255,255,255,0.1);}
.done-popup-emoji{font-size:3rem;margin-bottom:12px;}
.done-popup-msg{font-family:'Nunito',sans-serif;font-size:1.3rem;font-weight:900;
  background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1.5;margin-bottom:24px;}
.done-popup-btn{padding:14px 40px;border-radius:30px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--cyan),var(--pink));
  font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;color:#0f0f1a;}

/* ===== REFLECT POPUP ===== */
#reflect-popup{display:none;position:fixed;inset:0;z-index:8000;background:rgba(0,0,0,.7);
  align-items:center;justify-content:center;padding:24px;}
#reflect-popup.active{display:flex;}
.reflect-card{background:linear-gradient(135deg,#1a1a2e,#22223a);border-radius:24px;padding:32px 24px;
  text-align:center;max-width:320px;width:100%;border:1px solid rgba(255,255,255,0.1);}
.reflect-day{font-family:'Nunito',sans-serif;font-size:3rem;font-weight:900;
  background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.reflect-msg{font-size:1.1rem;font-weight:700;color:var(--text);margin:12px 0 24px;line-height:1.6;}
.reflect-btn{padding:14px 40px;border-radius:30px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--yellow),var(--orange));
  font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;color:#0f0f1a;}

/* ===== MILESTONE ===== */
#milestone-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);
  align-items:center;justify-content:center;flex-direction:column;}
#milestone-overlay.active{display:flex;}
.milestone-msg{font-family:'Nunito',sans-serif;font-size:2rem;font-weight:900;text-align:center;
  background:linear-gradient(135deg,var(--yellow),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;padding:0 24px;}
.milestone-day{font-size:4rem;font-weight:900;font-family:'Nunito',sans-serif;
  background:linear-gradient(135deg,var(--cyan),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.milestone-close{margin-top:28px;padding:14px 40px;border-radius:30px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--cyan),var(--pink));
  font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:900;color:#0f0f1a;}
.firework{position:fixed;pointer-events:none;border-radius:50%;animation:fw .8s ease-out forwards;}
@keyframes fw{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--fx),var(--fy)) scale(0);opacity:0;}}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup-screen" class="screen active">
  <div class="setup-header">
    <div class="logo">BURN IT!</div>
    <div class="sub">Daily Habit Tracker</div>
  </div>
  <div class="goal-wrap">
    <div class="goal-label">どんな自分になりたい？</div>
    <textarea class="goal-input" id="goal-input" rows="2" placeholder="例）健康的な習慣が自然にできる自分&#10;12月15日まで－5㎏、好きな服を着てお祝いする！"></textarea>
    <button class="goal-history-btn" id="goal-history-btn">📖 過去の目標を見る ▼</button>
    <div class="goal-history-list" id="goal-history-list"></div>
  </div>
  <div class="section-label">今日のタスクを設定</div>
  <div class="task-list" id="task-list"></div>
  <button class="add-btn" id="add-btn">＋ タスクを追加</button>
  <button class="back-to-today-btn" id="back-to-today-btn" style="display:none;">→ 今日のタスクに戻る</button>
  <button class="start-btn" id="start-btn">🔥 START</button>
</div>

<!-- TRACKER -->
<div id="tracker-screen" class="screen">
  <div class="tracker-header">
    <div class="tracker-logo">BURN IT!</div>
    <div class="streak-badge" id="streak-badge">🔥 0日連続</div>
  </div>
  <div class="date-bar" id="date-bar"></div>
  <div class="progress-wrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="pct-label" id="pct-label">0%</div>
  </div>
  <div class="bubbles-area" id="bubbles-area"></div>
  <div class="bottom-bar">
    <button class="done-btn" id="done-btn">✅ 今日はここまで！</button>
    <div class="nav-row">
      <button class="nav-btn active-tab" id="nav-today">TODAY</button>
      <button class="nav-btn" id="nav-history">HISTORY</button>
      <button class="nav-btn" id="nav-reset-today">RESET TODAY</button>
    </div>
  </div>
</div>

<!-- HISTORY -->
<div id="history-screen" class="screen">
  <div class="history-header">
    <div class="history-title">HISTORY</div>
    <button class="back-btn" id="back-btn">← 戻る</button>
  </div>
  <div class="tab-row">
    <button class="tab-btn active" data-range="week">週</button>
    <button class="tab-btn" data-range="month">月</button>
    <button class="tab-btn" data-range="all">全期間</button>
  </div>
  <div class="chart-wrap"><canvas id="hist-chart" height="160"></canvas></div>
  <div class="rec-list" id="rec-list"></div>
  <div class="reset-wrap">
    <button class="reset-btn" id="full-reset-btn">⚠️ 全データをリセット</button>
  </div>
</div>

<!-- DONE POPUP -->
<div id="done-popup">
  <div class="done-popup-card">
    <div class="done-popup-emoji" id="done-popup-emoji">🔥</div>
    <div class="done-popup-msg" id="done-popup-msg"></div>
    <button class="done-popup-btn" id="done-popup-btn">OK！</button>
  </div>
</div>

<!-- REFLECT POPUP -->
<div id="reflect-popup">
  <div class="reflect-card">
    <div class="reflect-day" id="reflect-day"></div>
    <div class="reflect-msg" id="reflect-msg"></div>
    <button class="reflect-btn" id="reflect-btn">ありがとう ✨</button>
  </div>
</div>

<!-- MILESTONE -->
<div id="milestone-overlay">
  <div class="milestone-day" id="ms-day"></div>
  <div class="milestone-msg" id="ms-msg"></div>
  <button class="milestone-close" id="ms-close">KEEP GOING 🔥</button>
</div>

<script>
const STORE_KEY='burnit_v2';
const MILESTONES=[3,7,10,14,20,21,25,30,40,45,50,60,70,80,85,90,95,100];
const WEEKDAYS=['日','月','火','水','木','金','土'];
const BUBBLE_DEFS=[
  {base:'#00e5ff',mid:'#0099cc',dark:'#005577'},// cyan
  {base:'#ff4db8',mid:'#cc2288',dark:'#881155'},// pink
  {base:'#ffe234',mid:'#ddaa00',dark:'#997700'},// yellow
];

function drawBubble(canvas, colorIdx, size){
  const c=canvas.getContext('2d');
  const r=size/2;
  canvas.width=size; canvas.height=size;
  const col=BUBBLE_DEFS[colorIdx%3];
  // シンプルなラジアルグラデーション（奥行きのみ）
  const g=c.createRadialGradient(r*0.6,r*0.5,r*0.1, r,r,r);
  g.addColorStop(0,col.base);
  g.addColorStop(0.6,col.mid);
  g.addColorStop(1,col.dark);
  c.beginPath();c.arc(r,r,r-1,0,Math.PI*2);
  c.fillStyle=g;c.fill();
}

let taskList={};// {id:{name,done}}
let nextId=1;
let histRange='week';

function loadData(){
  try{return JSON.parse(localStorage.getItem(STORE_KEY))||{};}catch(e){return{};}
}
function saveData(d){localStorage.setItem(STORE_KEY,JSON.stringify(d));}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fmtD(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

// ===== SETUP =====
function initSetup(){
  const data=loadData();
  const today=todayStr();
  // 今日が記録済みでも一度セットアップを表示（タスクは引き継ぐ）
  if(data[today]&&data[today].tasks){
    // 今日のタスクを引き継ぎ（done状態も保持）
    taskList={};nextId=1;
    data[today].tasks.forEach(t=>{
      const id='t'+nextId++;
      taskList[id]={name:t.name,done:t.done};
    });
    renderTaskList();
    const savedGoal=data['__goal']||'';
    document.getElementById('goal-input').value=savedGoal;
    return;
  }
  // 前回のタスク設定を引き継ぐ
  const keys=Object.keys(data).filter(k=>k!=='__settings').sort();
  const lastKey=keys[keys.length-1];
  const lastTasks=lastKey&&data[lastKey].tasks?data[lastKey].tasks:[];
  taskList={};nextId=1;
  if(lastTasks.length>0){
    lastTasks.forEach(t=>{
      const id='t'+nextId++;
      taskList[id]={name:t.name,done:false};
    });
  } else {
    const defaults=['朝 3分ストレッチ','朝 白湯を飲む','夜8時以降食べない','筋トレ①20回','体重を量る'];
    defaults.forEach(name=>{
      const id='t'+nextId++;
      taskList[id]={name,done:false};
    });
  }
  renderTaskList();
  // 目標を復元
  const d2=loadData();
  const savedGoal=d2['__goal']||'';
  document.getElementById('goal-input').value=savedGoal;
  renderGoalHistory();
}

function renderGoalHistory(){
  const data=loadData();
  const history=data['__goalHistory']||[];
  const current=data['__goal']||'';
  const el=document.getElementById('goal-history-list');
  if(!history.length){el.innerHTML='<div style="font-size:.8rem;color:var(--muted);">まだ記録がありません</div>';return;}
  el.innerHTML='';
  // 新しい順に表示
  [...history].reverse().forEach((h,i)=>{
    const d=new Date(h.date.replace(/-/g,'/'));
    const dateStr=`${d.getMonth()+1}/${d.getDate()}`;
    const isCurrent=h.text===current&&i===0;
    const item=document.createElement('div');item.className='goal-history-item';
    item.innerHTML=`<div class="goal-history-date">${dateStr}</div><div class="goal-history-text${isCurrent?' current':''}">${h.text}${isCurrent?' ← 今':''}</div>`;
    el.appendChild(item);
  });
}

document.getElementById('goal-history-btn').addEventListener('click',()=>{
  const list=document.getElementById('goal-history-list');
  const isOpen=list.classList.contains('open');
  list.classList.toggle('open');
  document.getElementById('goal-history-btn').textContent=isOpen?'📖 過去の目標を見る ▼':'📖 過去の目標を閉じる ▲';
});

function renderTaskList(){
  const el=document.getElementById('task-list');
  el.innerHTML='';
  Object.entries(taskList).forEach(([id,t])=>{
    const row=document.createElement('div');
    row.className='task-row';
    row.dataset.id=id;
    const inp=document.createElement('input');
    inp.type='text';inp.placeholder='タスク名を入力';inp.value=t.name;
    inp.addEventListener('input',e=>{taskList[id].name=e.target.value;});
    const del=document.createElement('button');
    del.className='del-btn';del.textContent='×';
    del.addEventListener('click',()=>{
      if(Object.keys(taskList).length<=1)return;
      delete taskList[id];
      renderTaskList();
    });
    row.appendChild(inp);row.appendChild(del);
    el.appendChild(row);
  });
}

document.getElementById('add-btn').addEventListener('click',()=>{
  if(Object.keys(taskList).length>=10)return;
  const id='t'+nextId++;
  taskList[id]={name:'',done:false};
  renderTaskList();
  // 最後の入力欄にフォーカス
  const inputs=document.querySelectorAll('.task-row input');
  if(inputs.length)inputs[inputs.length-1].focus();
});

document.getElementById('back-to-today-btn').addEventListener('click',()=>{
  showScreen('tracker-screen');
  renderTracker();
});

document.getElementById('start-btn').addEventListener('click',()=>{
  // 空のタスクを除去
  Object.keys(taskList).forEach(id=>{
    if(!taskList[id].name.trim())delete taskList[id];
  });
  if(Object.keys(taskList).length===0){
    const id='t'+nextId++;
    taskList[id]={name:'デフォルトタスク',done:false};
  }
  showScreen('tracker-screen');
  renderTracker();
});

// ===== TRACKER =====
function renderTracker(){
  const d=new Date();
  document.getElementById('date-bar').textContent=
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WEEKDAYS[d.getDay()]}）`;
  renderBubbles();
  updateProgress();
  updateStreak();
}

function renderBubbles(){
  const area=document.getElementById('bubbles-area');
  area.innerHTML='';
  const ids=Object.keys(taskList);
  const n=ids.length;
  if(!n)return;

  // エリアサイズ取得（非表示時のフォールバックあり）
  const areaW=area.offsetWidth||window.innerWidth-32;
  const areaH=area.offsetHeight||(window.innerHeight*0.50);

  // 列・行数
  const cols=n<=2?n:n<=4?2:n<=6?3:n<=8?4:5;
  const rows=Math.ceil(n/cols);
  const gap=10;
  const maxW=Math.floor((areaW-(cols-1)*gap)/cols);
  const maxH=Math.floor((areaH-(rows-1)*gap)/rows);
  const baseSize=Math.min(maxW,maxH,148);

  // 大中小パターン（5個がデフォルト）
  // 大・中・小をシャッフルしてランダムなバラつきを生成
  const sizes=[1.0,0.92,0.82,0.72,0.62];// 大〜小の5段階
  // n個分のサイズをランダムに生成（大が少なくとも1つ、小が少なくとも1つ入るように）
  function makeRandomPat(count){
    const pool=[];
    for(let i=0;i<count;i++) pool.push(sizes[i%sizes.length]);
    // Fisher-Yatesシャッフル
    for(let i=pool.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]]=[pool[j],pool[i]];
    }
    return pool;
  }
  const pat=makeRandomPat(n);

  ids.forEach((id,i)=>{
    const t=taskList[id];
    const sz=Math.max(60,Math.round(baseSize*pat[i]));

    const div=document.createElement('div');
    div.className='bubble'+(t.done?' done':'');
    div.style.width=sz+'px';
    div.style.height=sz+'px';
    div.dataset.id=id;

    // Canvasでバブル描画
    const cvs=document.createElement('canvas');
    drawBubble(cvs, i%3, sz);
    div.appendChild(cvs);

    // テキスト
    const span=document.createElement('span');
    span.className='bubble-text';
    span.style.fontSize=sz<72?'.58rem':sz<92?'.65rem':'.73rem';
    span.textContent=t.name||'タスク';
    div.appendChild(span);

    div.addEventListener('click',()=>tapBubble(id,div));
    area.appendChild(div);
  });
}

function tapBubble(id,el){
  if(taskList[id].done)return;
  taskList[id].done=true;
  el.classList.add('done');
  popEffect(el);
  updateProgress();
}

function popEffect(el){
  const rect=el.getBoundingClientRect();
  const cx=rect.left+rect.width/2;const cy=rect.top+rect.height/2;
  const colors=['#00e5ff','#ff4db8','#ffe234','#39ff14','#ff9a3c','#c77dff'];
  for(let i=0;i<12;i++){
    const p=document.createElement('div');
    p.className='pop-particle';
    const angle=(i/12)*Math.PI*2;
    const dist=40+Math.random()*60;
    p.style.cssText=`left:${cx}px;top:${cy}px;width:10px;height:10px;
      background:${colors[i%colors.length]};
      --tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),700);
  }
}

function updateProgress(){
  const ids=Object.keys(taskList);
  const done=ids.filter(id=>taskList[id].done).length;
  const pct=ids.length?Math.round(done/ids.length*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('pct-label').textContent=pct+'%';
}

function updateStreak(){
  const data=loadData();
  const streak=calcStreak(data);
  document.getElementById('streak-badge').textContent=`🔥 ${streak}日連続`;
}

function calcStreak(data){
  const keys=Object.keys(data).filter(k=>k!=='__settings'&&data[k].done).sort().reverse();
  if(!keys.length)return 0;
  let streak=0;const today=new Date();today.setHours(0,0,0,0);
  for(let i=0;i<keys.length;i++){
    const d=parseD(keys[i]);d.setHours(0,0,0,0);
    const diff=Math.round((today-d)/(86400000));
    if(diff===i)streak++;else break;
  }
  return streak;
}

function fireFireworks(level){

// ===== HISTORY =====
function renderHistory(){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.range===histRange);
  });
  const data=loadData();
  const allKeys=Object.keys(data).filter(k=>k!=='__settings').sort();
  const today=new Date();today.setHours(0,0,0,0);
  let keys;
  if(histRange==='week'){
    keys=allKeys.filter(k=>{const d=parseD(k);d.setHours(0,0,0,0);return(today-d)<=6*86400000;});
  }else if(histRange==='month'){
    keys=allKeys.filter(k=>{const d=parseD(k);d.setHours(0,0,0,0);return(today-d)<=29*86400000;});
  }else{keys=allKeys;}
  drawChart(keys,data);
  renderRecList(keys.slice().reverse(),data);
}

document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click',()=>{histRange=b.dataset.range;renderHistory();});
});

function drawChart(keys,data){
  const canvas=document.getElementById('hist-chart');
  const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth||300;const H=160;
  canvas.width=W;canvas.height=H;
  ctx.clearRect(0,0,W,H);
  if(!keys.length){ctx.fillStyle='#888aaa';ctx.font='14px sans-serif';ctx.fillText('記録なし',W/2-30,H/2);return;}
  const vals=keys.map(k=>data[k]?.pct||0);
  const maxV=100;const pad={l:24,r:8,t:10,b:28};
  const bw=Math.max(4,(W-pad.l-pad.r)/keys.length-4);
  ctx.fillStyle='rgba(0,229,255,0.08)';
  for(let i=0;i<=4;i++){
    const y=pad.t+(H-pad.t-pad.b)*(1-i/4);
    ctx.fillRect(pad.l,y,W-pad.l-pad.r,1);
    ctx.fillStyle='#555770';ctx.font='10px sans-serif';
    ctx.fillText(i*25+'%',2,y+4);ctx.fillStyle='rgba(0,229,255,0.08)';
  }
  keys.forEach((k,i)=>{
    const x=pad.l+(W-pad.l-pad.r)*i/keys.length+(W-pad.l-pad.r)/(keys.length*2)-bw/2;
    const bh=(vals[i]/maxV)*(H-pad.t-pad.b);
    const y=pad.t+(H-pad.t-pad.b)-bh;
    const grad=ctx.createLinearGradient(0,y,0,y+bh);
    grad.addColorStop(0,'#00e5ff');grad.addColorStop(1,'#ff4db8');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.roundRect(x,y,bw,bh,3);ctx.fill();
    const d=parseD(k);
    ctx.fillStyle='#888aaa';ctx.font='9px sans-serif';
    ctx.fillText(`${d.getMonth()+1}/${d.getDate()}`,x-2,H-4);
  });
}

function renderRecList(keys,data){
  const el=document.getElementById('rec-list');el.innerHTML='';
  keys.forEach(k=>{
    const r=data[k];if(!r)return;
    const d=parseD(k);
    const item=document.createElement('div');item.className='rec-item';
    const sc=r.pct>=80?'#00e5ff':r.pct>=50?'#ff9a3c':'#606080';
    const tags=r.tasks?r.tasks.map(t=>`<span class="rec-tag ${t.done?'done':''}">${t.done?'✓ ':''}${t.name}</span>`).join(''):'';
    item.innerHTML=`<div class="rec-date"><div class="rec-mo">${d.getMonth()+1}月</div><div class="rec-day">${d.getDate()}</div><div class="rec-wd">${WEEKDAYS[d.getDay()]}</div></div><div class="rec-info"><div class="rec-tags">${tags}</div></div><div class="rec-score" style="color:${sc}">${r.pct}%</div>`;
    el.appendChild(item);
  });
}

document.getElementById('full-reset-btn').addEventListener('click',()=>{
