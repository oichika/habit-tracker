<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BURN IT!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0f0f1a; --surface:#1a1a2e; --card:#22223a; --border:rgba(255,255,255,0.08);
  --coral:#ff5f6d; --orange:#ff9a3c; --lime:#b8f050; --cyan:#38e8d8;
  --purple:#a855f7; --pink:#f472b6; --yellow:#fde047; --sky:#38bdf8;
  --text:#ffffff; --text2:#a0a0c0; --text3:#606080;
  --font:'Nunito','Noto Sans JP',sans-serif;
}
body { font-family:var(--font); background:var(--bg); min-height:100dvh; color:var(--text); overflow-x:hidden; }
.screen { display:none; min-height:100dvh; }
.screen.active { display:flex; flex-direction:column; }
#setup-screen { background:var(--bg); overflow-y:auto; }
.setup-hero { background:linear-gradient(135deg,#1a0a2e 0%,#0f1a2e 50%,#1a1a0f 100%); padding:48px 24px 28px; text-align:center; position:relative; overflow:hidden; }
.setup-hero::before { content:''; position:absolute; top:-60px; right:-40px; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle,rgba(255,95,109,0.25) 0%,transparent 70%); animation:orb1 6s ease-in-out infinite alternate; }
.setup-hero::after { content:''; position:absolute; bottom:-40px; left:-30px; width:160px; height:160px; border-radius:50%; background:radial-gradient(circle,rgba(56,232,216,0.2) 0%,transparent 70%); animation:orb2 5s ease-in-out infinite alternate; }
@keyframes orb1 { from{transform:translate(0,0);} to{transform:translate(-20px,20px);} }
@keyframes orb2 { from{transform:translate(0,0);} to{transform:translate(20px,-15px);} }
.hero-badge { display:inline-block; background:var(--coral); color:#fff; font-size:0.65rem; font-weight:900; letter-spacing:0.2em; padding:4px 12px; border-radius:20px; margin-bottom:14px; text-transform:uppercase; }
.hero-title { font-size:2.4rem; font-weight:900; letter-spacing:0.04em; line-height:1; background:linear-gradient(135deg,var(--coral),var(--orange),var(--yellow)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.hero-sub { font-size:0.78rem; color:var(--text2); margin-top:8px; }
.setup-tabs { display:flex; background:var(--surface); border-bottom:1px solid var(--border); }
.setup-tab { flex:1; padding:13px 8px; border:none; border-bottom:2px solid transparent; background:none; font-family:var(--font); font-size:0.78rem; font-weight:800; color:var(--text3); cursor:pointer; transition:all 0.2s; text-transform:uppercase; }
.setup-tab.active { color:var(--coral); border-bottom-color:var(--coral); }
.setup-body { padding:18px 18px 100px; display:flex; flex-direction:column; gap:10px; }
.slot-header { display:flex; align-items:center; justify-content:space-between; padding:0 2px; margin-bottom:2px; }
.slot-header-label { font-size:0.68rem; color:var(--text3); font-weight:800; letter-spacing:0.12em; text-transform:uppercase; }
.task-count-badge { font-size:0.68rem; color:var(--cyan); background:rgba(56,232,216,0.1); padding:3px 10px; border-radius:20px; border:1px solid rgba(56,232,216,0.25); font-weight:800; }
.task-slot { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:10px; }
.task-slot:focus-within { border-color:var(--coral); box-shadow:0 0 0 3px rgba(255,95,109,0.12); }
.slot-pill { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.slot-name-input { flex:1; background:none; border:none; outline:none; font-family:var(--font); font-size:0.9rem; font-weight:800; color:var(--text); }
.slot-name-input::placeholder { color:var(--text3); font-weight:700; }
.slot-pct-badge { font-size:0.65rem; color:var(--cyan); background:rgba(56,232,216,0.08); padding:2px 8px; border-radius:20px; border:1px solid rgba(56,232,216,0.2); white-space:nowrap; flex-shrink:0; font-weight:800; }
.slot-delete { width:22px; height:22px; border-radius:50%; border:1px solid var(--border); background:none; color:var(--text3); font-size:0.75rem; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.slot-delete:active { background:var(--coral); color:#fff; border-color:var(--coral); }
.add-task-btn { border:1.5px dashed rgba(255,255,255,0.15); border-radius:14px; padding:12px; background:none; color:var(--text3); font-family:var(--font); font-size:0.82rem; font-weight:800; cursor:pointer; width:100%; text-transform:uppercase; }
.add-task-btn:disabled { opacity:0.25; cursor:not-allowed; }
.start-wrap { position:fixed; bottom:0; left:0; right:0; padding:14px 18px 28px; background:linear-gradient(to top,var(--bg) 70%,transparent); z-index:20; }
.start-btn { width:100%; padding:17px; border:none; border-radius:14px; background:linear-gradient(135deg,var(--coral),var(--orange)); color:#fff; font-family:var(--font); font-size:1rem; font-weight:900; letter-spacing:0.12em; cursor:pointer; text-transform:uppercase; box-shadow:0 6px 24px rgba(255,95,109,0.45); position:relative; overflow:hidden; }
.start-btn::after { content:''; position:absolute; top:0; left:-100%; width:60%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent); animation:shimmer 2.5s ease-in-out infinite; }
@keyframes shimmer { to{left:150%;} }
#tracker-screen { background:var(--bg); position:relative; overflow:hidden; }
#tracker-screen::before { content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 20% 80%,rgba(184,240,80,0.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(255,95,109,0.08) 0%,transparent 50%); }
#tracker-screen::after { content:''; position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px); background-size:40px 40px; }
.tracker-header { position:absolute; top:0; left:0; right:0; padding:18px 20px 14px; display:flex; align-items:center; justify-content:space-between; z-index:10; background:linear-gradient(to bottom,rgba(15,15,26,0.95) 60%,transparent); }
.tracker-title { font-size:0.82rem; font-weight:900; color:var(--text2); letter-spacing:0.12em; text-transform:uppercase; }
.progress-wrap { text-align:center; }
.progress-text { font-size:1.1rem; font-weight:900; background:linear-gradient(135deg,var(--coral),var(--orange)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.progress-sub { font-size:0.58rem; color:var(--text3); font-weight:800; letter-spacing:0.1em; text-transform:uppercase; }
.nav-btn { background:none; border:1px solid var(--border); border-radius:8px; color:var(--text2); font-family:var(--font); font-size:0.68rem; font-weight:800; padding:6px 10px; cursor:pointer; }
.finish-btn { position:absolute; bottom:24px; left:50%; transform:translateX(-50%); padding:13px 34px; border:1px solid rgba(255,255,255,0.15); border-radius:40px; background:rgba(255,255,255,0.06); color:var(--text2); font-family:var(--font); font-size:0.78rem; font-weight:800; letter-spacing:0.1em; cursor:pointer; z-index:10; white-space:nowrap; backdrop-filter:blur(8px); text-transform:uppercase; }
.finish-btn:active { border-color:var(--coral); }
#bubble-field { position:absolute; inset:0; width:100%; height:100%; }
.bubble { position:absolute; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:transform 0.12s; user-select:none; -webkit-tap-highlight-color:transparent; text-align:center; padding:14px; }
.bubble:active { transform:scale(0.91) !important; }
.bubble .b-name { font-family:var(--font); font-size:clamp(0.62rem,3vw,0.9rem); font-weight:900; color:#fff; line-height:1.25; word-break:break-all; max-width:86%; text-shadow:0 2px 8px rgba(0,0,0,0.4); }
.bubble .b-tap { font-size:clamp(0.5rem,2vw,0.62rem); color:rgba(255,255,255,0.6); margin-top:5px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; }
.bubble::after { content:''; position:absolute; top:12%; left:16%; width:24%; height:16%; background:rgba(255,255,255,0.35); border-radius:50%; filter:blur(4px); pointer-events:none; }
.bubble::before { content:''; position:absolute; inset:-4px; border-radius:50%; border:2px solid rgba(255,255,255,0.12); animation:pulseRing 3s ease-in-out infinite; }
@keyframes pulseRing { 0%,100%{transform:scale(1);opacity:0.4;} 50%{transform:scale(1.06);opacity:0;} }
@keyframes explodePop { 0%{transform:scale(1);opacity:1;} 20%{transform:scale(1.25);opacity:0.9;} 50%{transform:scale(0.8);opacity:0.5;} 100%{transform:scale(0);opacity:0;} }
.bubble.popping { animation:explodePop 0.45s cubic-bezier(0.36,0.07,0.19,0.97) forwards; pointer-events:none; }
.confetti { position:fixed; pointer-events:none; z-index:100; }
@keyframes confettiFly { 0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1);} 100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(0.1);} }
#complete-screen { background:linear-gradient(160deg,#0f0f1a 0%,#1a0a1a 50%,#0a1a0f 100%); align-items:center; justify-content:center; text-align:center; padding:48px 28px; gap:16px; position:relative; overflow:hidden; }
#complete-screen::before { content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 30%,rgba(255,95,109,0.15) 0%,transparent 60%),radial-gradient(ellipse at 20% 80%,rgba(184,240,80,0.1) 0%,transparent 50%); }
.complete-fire { font-size:4rem; animation:fireWiggle 0.5s ease-in-out infinite alternate; }
@keyframes fireWiggle { from{transform:scale(1) rotate(-5deg);} to{transform:scale(1.1) rotate(5deg);} }
.complete-title { font-size:1.6rem; font-weight:900; letter-spacing:0.1em; text-transform:uppercase; color:#fff; }
.complete-score { font-size:4.5rem; font-weight:900; line-height:1; background:linear-gradient(135deg,var(--coral),var(--orange),var(--yellow)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.complete-score-label { font-size:0.7rem; color:var(--text3); font-weight:800; letter-spacing:0.15em; text-transform:uppercase; }
.complete-done { font-size:0.85rem; color:var(--lime); font-weight:800; }
.complete-msg { color:var(--text2); font-size:0.86rem; line-height:2; }
.complete-divider { width:40px; height:2px; background:linear-gradient(90deg,var(--coral),var(--orange)); border-radius:2px; }
.complete-btns { display:flex; flex-direction:column; gap:10px; width:100%; }
.btn-main { padding:16px; border:none; border-radius:14px; background:linear-gradient(135deg,var(--coral),var(--orange)); color:#fff; font-family:var(--font); font-size:0.9rem; font-weight:900; letter-spacing:0.1em; cursor:pointer; text-transform:uppercase; box-shadow:0 6px 24px rgba(255,95,109,0.4); }
.btn-sub { padding:13px; border:1px solid var(--border); border-radius:14px; background:none; color:var(--text2); font-family:var(--font); font-size:0.82rem; font-weight:800; cursor:pointer; }
#history-screen { background:var(--bg); overflow-y:auto; }
.hist-header { position:sticky; top:0; background:rgba(15,15,26,0.97); padding:22px 18px 0; z-index:10; border-bottom:1px solid var(--border); backdrop-filter:blur(12px); }
.hist-top { display:flex; align-items:baseline; justify-content:space-between; padding-bottom:14px; }
.hist-title { font-size:1.2rem; font-weight:900; color:var(--text); letter-spacing:0.08em; text-transform:uppercase; }
.hist-sub { font-size:0.68rem; color:var(--text3); font-weight:800; }
.tab-row { display:flex; }
.tab-btn { flex:1; padding:10px 4px; border:none; border-bottom:2px solid transparent; background:none; font-family:var(--font); font-size:0.7rem; font-weight:800; color:var(--text3); cursor:pointer; transition:all 0.2s; text-transform:uppercase; }
.tab-btn.active { color:var(--coral); border-bottom-color:var(--coral); }
.hist-body { padding:18px; display:flex; flex-direction:column; gap:20px; }
.summary-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px; display:flex; align-items:center; gap:14px; position:relative; overflow:hidden; }
.summary-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--coral),var(--orange),var(--yellow)); }
.sum-left { flex:1; }
.sum-lbl { font-size:0.65rem; color:var(--text3); font-weight:800; letter-spacing:0.12em; text-transform:uppercase; }
.sum-avg { font-size:2.2rem; font-weight:900; background:linear-gradient(135deg,var(--coral),var(--orange)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1.1; }
.sum-days { font-size:0.65rem; color:var(--text3); font-weight:700; margin-top:2px; }
.sum-icon { font-size:2.2rem; }
.chart-lbl { font-size:0.65rem; font-weight:800; color:var(--text3); letter-spacing:0.12em; text-transform:uppercase; margin-bottom:10px; }
.bar-chart { display:flex; align-items:flex-end; gap:4px; height:120px; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
.bar-wrap { width:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; flex:1; }
.bar { width:100%; border-radius:4px 4px 0 0; min-height:3px; position:relative; }
.bar-v { font-size:0.55rem; font-weight:800; color:var(--text2); position:absolute; top:-15px; left:50%; transform:translateX(-50%); white-space:nowrap; }
.bar-lbl { font-size:0.54rem; color:var(--text3); font-weight:700; text-align:center; line-height:1.3; white-space:pre-line; }
.list-lbl { font-size:0.65rem; font-weight:800; color:var(--text3); letter-spacing:0.12em; text-transform:uppercase; margin-bottom:10px; }
.rec-list { display:flex; flex-direction:column; gap:8px; }
.rec-item { background:var(--card); border:1px solid var(--border); border-radius:13px; padding:12px 14px; display:flex; align-items:center; gap:12px; }
.rec-date { flex-shrink:0; text-align:center; }
.rec-mo { font-size:0.58rem; color:var(--text3); font-weight:800; text-transform:uppercase; }
.rec-day { font-size:1.4rem; font-weight:900; color:var(--text); line-height:1; }
.rec-wd { font-size:0.56rem; color:var(--text3); font-weight:800; }
.rec-info { flex:1; }
.rec-tags { display:flex; flex-wrap:wrap; gap:3px; }
.rec-tag { font-size:0.58rem; padding:2px 7px; border-radius:20px; border:1px solid var(--border); color:var(--text3); background:none; font-weight:700; }
.rec-tag.done { border-color:rgba(184,240,80,0.4); color:var(--lime); background:rgba(184,240,80,0.08); }
.rec-score { font-size:1.3rem; font-weight:900; flex-shrink:0; }
.empty-st { text-align:center; padding:48px 20px; color:var(--text3); }
.empty-st .ei { font-size:2.4rem; display:block; margin-bottom:12px; }
.empty-st p { font-size:0.82rem; line-height:1.9; }
.back-btn { margin:0 18px 28px; padding:13px; border:1px solid var(--border); border-radius:12px; background:none; color:var(--text2); font-family:var(--font); font-size:0.78rem; font-weight:800; cursor:pointer; width:calc(100% - 36px); text-transform:uppercase; }
</style>
</head>
<body>
<div id="setup-screen" class="screen active">
  <div class="setup-hero">
    <div class="hero-badge">💪 Daily Burn</div>
    <div class="hero-title">BURN IT!</div>
    <div class="hero-sub">今日のタスクを全部こなして、体を変えよう</div>
  </div>
  <div class="setup-tabs">
    <button class="setup-tab active" onclick="showSetupTab(0)">今日のタスク</button>
    <button class="setup-tab" onclick="showScreen('history-screen');renderHistory()">記録を見る</button>
  </div>
  <div class="setup-body">
    <div class="slot-header">
      <span class="slot-header-label">タスクを設定</span>
      <span class="task-count-badge" id="count-badge">5 / 10</span>
    </div>
    <div id="task-slots"></div>
    <button class="add-task-btn" id="add-btn" onclick="addTask()">＋ タスクを追加</button>
  </div>
  <div class="start-wrap">
    <button class="start-btn" onclick="startTracker()">🔥 スタート！</button>
  </div>
</div>
<div id="tracker-screen" class="screen">
  <div class="tracker-header">
    <span class="tracker-title">🔥 Burn It</span>
    <div class="progress-wrap">
      <div class="progress-text" id="progress-text">0%</div>
      <div class="progress-sub" id="progress-sub">0 / 0 done</div>
    </div>
    <button class="nav-btn" onclick="goSetup()">← BACK</button>
  </div>
  <div id="bubble-field"></div>
  <button class="finish-btn" onclick="finishNow()">今日はここまで ✓</button>
</div>
<div id="complete-screen" class="screen">
  <div class="complete-fire">🔥</div>
  <div class="complete-title">やったね！</div>
  <div class="complete-score" id="final-pct">0%</div>
  <div class="complete-score-label">Today's Score</div>
  <div class="complete-done" id="done-count"></div>
  <div class="complete-divider"></div>
  <div class="complete-msg" id="complete-msg"></div>
  <div class="complete-btns">
    <button class="btn-main" onclick="showScreen('history-screen');renderHistory()">📊 記録を見る</button>
    <button class="btn-sub" onclick="goSetup()">また明日も 🌙</button>
  </div>
</div>
<div id="history-screen" class="screen">
  <div class="hist-header">
    <div class="hist-top">
      <div class="hist-title">📊 Records</div>
      <span class="hist-sub">積み重ねた記録</span>
    </div>
    <div class="tab-row">
      <button class="tab-btn active" id="tab-week" onclick="switchTab('week')">1週間</button>
      <button class="tab-btn" id="tab-month" onclick="switchTab('month')">今月</button>
      <button class="tab-btn" id="tab-all" onclick="switchTab('all')">全期間</button>
    </div>
  </div>
  <div class="hist-body" id="hist-body"></div>
  <button class="back-btn" onclick="goSetup()">← トップに戻る</button>
</div>
<script>
const BSTYLES=[
  {bg:'radial-gradient(circle at 33% 28%,#ff8a6d,#e03020)',shadow:'rgba(224,48,32,0.5)',hex:'#ff5f3d'},
  {bg:'radial-gradient(circle at 33% 28%,#60f0d0,#18a890)',shadow:'rgba(24,168,144,0.5)',hex:'#38e8d8'},
  {bg:'radial-gradient(circle at 33% 28%,#d8f870,#90c820)',shadow:'rgba(144,200,32,0.5)',hex:'#b8f050'},
  {bg:'radial-gradient(circle at 33% 28%,#c080f8,#8030d8)',shadow:'rgba(128,48,216,0.5)',hex:'#a855f7'},
  {bg:'radial-gradient(circle at 33% 28%,#ffc060,#e07010)',shadow:'rgba(224,112,16,0.5)',hex:'#ff9a3c'},
  {bg:'radial-gradient(circle at 33% 28%,#f888c8,#d03890)',shadow:'rgba(208,56,144,0.5)',hex:'#f472b6'},
  {bg:'radial-gradient(circle at 33% 28%,#80d8f8,#1890d0)',shadow:'rgba(24,144,208,0.5)',hex:'#38bdf8'},
  {bg:'radial-gradient(circle at 33% 28%,#fef080,#e0c010)',shadow:'rgba(224,192,16,0.5)',hex:'#fde047'},
  {bg:'radial-gradient(circle at 33% 28%,#a0f0a0,#30b840)',shadow:'rgba(48,184,64,0.5)',hex:'#4ade80'},
  {bg:'radial-gradient(circle at 33% 28%,#ffa0a0,#e03050)',shadow:'rgba(224,48,80,0.5)',hex:'#f87171'},
];
const WEEKDAYS=['日','月','火','水','木','金','土'];
const PCT_MESSAGES={
  100:['🏆 完璧！！全タスク制覇！\n今日の自分、最高すぎ！','💯 パーフェクト！\nこの調子で体を変えていこう！'],
  80:['🔥 めちゃくちゃいい！\nほぼ完璧な一日！','✨ 素晴らしい！\n8割以上クリア、この調子で！'],
  60:['💪 いい感じ！\n半分以上やり切ったね！','👊 いいぞ！\n毎日続けることが一番大事！'],
  40:['🌱 始めた自分えらい！\n明日も一緒に頑張ろう！','⚡ やろうとした、それが大事！\nまた明日チャレンジしよ！'],
  0:['😴 今日は休憩日！\nたまには休むことも大事だよ。'],
};
const SKEY='burnit_v1';
function load(){try{return JSON.parse(localStorage.getItem(SKEY))||{tasks:null,records:[]};}catch(e){return{tasks:null,records:[]};}}
function save(d){localStorage.setItem(SKEY,JSON.stringify(d));}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function saveRecord(pct,doneArr){
  const data=load();
  data.records=(data.records||[]).filter(r=>r.date!==todayStr());
  data.records.push({date:todayStr(),pct,tasks:tasks.map((t,i)=>({name:t.name,done:doneArr[i]}))});
  data.records.sort((a,b)=>a.date.localeCompare(b.date));
  if(data.records.length>365)data.records=data.records.slice(-365);
  save(data);
}
const DEFAULT_NAMES=['朝ごはんを抜く','水を2L飲む','30分以上歩く','夜21時以降食べない','寝る前ストレッチ'];

// タスク名をオブジェクト配列で管理（インデックスずれを防ぐ）
let taskList=[
  {id:0,name:'朝ごはんを抜く'},
  {id:1,name:'水を2L飲む'},
  {id:2,name:'30分以上歩く'},
  {id:3,name:'夜21時以降食べない'},
  {id:4,name:'寝る前ストレッチ'},
];
let nextId=5;

function calcPct(n){return Math.floor(100/n);}
function calcPctForIdx(i,n){const base=Math.floor(100/n);return i===n-1?base+(100-base*n):base;}

function initSetup(){
  const saved=load();
  if(saved.tasks&&saved.tasks.length>0){
    taskList=saved.tasks.map((t,i)=>({id:i,name:t.name}));
    nextId=taskList.length;
  }
  renderSlots();
}

function renderSlots(){
  const c=document.getElementById('task-slots');
  c.innerHTML='';
  const n=taskList.length;
  taskList.forEach((task,i)=>{
    const el=document.createElement('div');
    el.className='task-slot';
    el.dataset.id=task.id;
    el.innerHTML=`
      <div class="slot-pill" style="background:${BSTYLES[i%BSTYLES.length].hex}"></div>
      <input type="text" class="slot-name-input" value="${task.name}" placeholder="タスク名を入力" maxlength="14" data-id="${task.id}">
      <span class="slot-pct-badge">${calcPctForIdx(i,n)}%</span>
      ${n>1?`<button class="slot-delete" data-id="${task.id}" onclick="deleteTask(${task.id})">×</button>`:''}
    `;
    const input=el.querySelector('input');
    // 入力のたびにtaskListを更新
    input.addEventListener('input',(e)=>{
      const tid=parseInt(e.target.dataset.id);
      const t=taskList.find(x=>x.id===tid);
      if(t)t.name=e.target.value;
    });
    input.addEventListener('keydown',(e)=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const all=document.querySelectorAll('.slot-name-input');
        const idx=Array.from(all).indexOf(e.target);
        if(idx<all.length-1){all[idx+1].focus();}else{e.target.blur();}
      }
    });
    c.appendChild(el);
  });
  document.getElementById('count-badge').textContent=`${n} / 10`;
  document.getElementById('add-btn').disabled=n>=10;
}

function addTask(){
  if(taskList.length>=10)return;
  taskList.push({id:nextId++,name:''});
  renderSlots();
  document.querySelectorAll('.slot-name-input')[taskList.length-1].focus();
}

function deleteTask(id){
  if(taskList.length<=1)return;
  taskList=taskList.filter(t=>t.id!==id);
  renderSlots();
}

function showSetupTab(idx){
  document.querySelectorAll('.setup-tab').forEach((b,i)=>b.classList.toggle('active',i===idx));
}

let tasks=[];
let done=[];

function startTracker(){
  const n=taskList.length;
  tasks=taskList.map((t,i)=>({
    name:t.name.trim()||`タスク${i+1}`,
    pct:calcPctForIdx(i,n)
  }));
  const data=load();data.tasks=tasks;save(data);
  done=new Array(tasks.length).fill(false);
  renderBubbles();
  showScreen('tracker-screen');
}

function renderBubbles(){
  const field=document.getElementById('bubble-field');
  field.innerHTML='';
  const W=window.innerWidth,H=window.innerHeight;
  const n=tasks.length;
  const maxR=Math.min(W,H)*(n<=5?0.19:n<=7?0.152:0.128);
  const minR=maxR*0.72;
  const pos=getPositions(n,W,H,minR,maxR);
  tasks.forEach((t,i)=>{
    const {x,y,r}=pos[i];
    const s=BSTYLES[i%BSTYLES.length];
    const el=document.createElement('div');
    el.className='bubble';
    el.id=`bubble-${i}`;
    el.style.cssText=`width:${r*2}px;height:${r*2}px;left:${x-r}px;top:${y-r}px;background:${s.bg};box-shadow:0 6px 32px ${s.shadow},0 0 0 1px rgba(255,255,255,0.08);`;
    el.innerHTML=`<span class="b-name">${t.name}</span><span class="b-tap">TAP!</span>`;
    el.addEventListener('click',()=>popBubble(i,x,y,s));
    el.addEventListener('touchstart',()=>{},{passive:true});
    field.appendChild(el);
  });
  updateProgress();
}

function getPositions(n,W,H,minR,maxR){
  const hh=62,mg=16,bh=72;
  const pos=[];let att=0;
  while(pos.length<n&&att<3000){
    att++;
    const r=minR+Math.random()*(maxR-minR);
    const x=r+mg+Math.random()*(W-r*2-mg*2);
    const y=hh+r+mg+Math.random()*(H-hh-r*2-mg*2-bh);
    if(!pos.some(p=>Math.hypot(p.x-x,p.y-y)<p.r+r+10))pos.push({x,y,r});
  }
  const cx=[.18,.5,.82,.32,.68,.18,.82,.5,.32,.68];
  const cy=[.22,.38,.55,.70,.30,.50,.28,.62,.42,.18];
  while(pos.length<n){const i=pos.length;pos.push({x:cx[i%cx.length]*W,y:hh+cy[i%cy.length]*(H-hh-bh),r:minR});}
  return pos;
}

function popBubble(i,cx,cy,style){
  if(done[i])return;
  done[i]=true;
  const el=document.getElementById(`bubble-${i}`);
  if(!el)return;
  const colors=[style.hex,'#ff5f6d','#fde047','#b8f050','#38e8d8','#a855f7','#ffffff'];
  for(let p=0;p<22;p++){
    const pt=document.createElement('div');
    pt.className='confetti';
    const sz=4+Math.random()*9;
    const isCircle=Math.random()>0.4;
    const angle=(Math.PI*2*p)/22+Math.random()*0.6;
    const dist=60+Math.random()*120;
    pt.style.cssText=`width:${sz}px;height:${sz}px;left:${cx}px;top:${cy}px;background:${colors[p%colors.length]};border-radius:${isCircle?'50%':'3px'};--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist-40}px;--rot:${Math.random()*720-360}deg;animation:confettiFly 0.65s cubic-bezier(0.2,0.8,0.4,1) forwards;`;
    document.body.appendChild(pt);
    setTimeout(()=>pt.remove(),700);
  }
  el.classList.add('popping');
  setTimeout(()=>{el.style.display='none';updateProgress();checkComplete();},460);
}

function updateProgress(){
  const doneCount=done.filter(Boolean).length;
  const pct=Math.round((doneCount/tasks.length)*100);
  document.getElementById('progress-text').textContent=`${pct}%`;
  document.getElementById('progress-sub').textContent=`${doneCount}/${tasks.length} done`;
}

function checkComplete(){if(done.every(Boolean))setTimeout(()=>showComplete(),600);}
function finishNow(){showComplete();}

function showComplete(){
  const doneCount=done.filter(Boolean).length;
  const pct=Math.round((doneCount/tasks.length)*100);
  saveRecord(pct,done);
  document.getElementById('final-pct').textContent=`${pct}%`;
  document.getElementById('done-count').textContent=`${doneCount} / ${tasks.length} タスク達成！`;
  const keys=Object.keys(PCT_MESSAGES).map(Number).sort((a,b)=>b-a);
  const key=keys.find(k=>pct>=k);
  const msgs=PCT_MESSAGES[key]||PCT_MESSAGES[0];
  document.getElementById('complete-msg').innerHTML=msgs[Math.floor(Math.random()*msgs.length)].replace(/\n/g,'<br>');
  showScreen('complete-screen');
}

let currentTab='week';
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  renderHistory();
}

function renderHistory(){
  const data=load();
  const records=data.records||[];
  const body=document.getElementById('hist-body');
  if(!records.length){body.innerHTML=`<div class="empty-st"><span class="ei">🔥</span><p>まだ記録がないよ！<br>今日のタスクを終えると<br>ここに記録が残るよ</p></div>`;return;}
  const now=new Date();
  let filtered;
  if(currentTab==='week'){const d7=new Date(now);d7.setDate(d7.getDate()-6);filtered=records.filter(r=>r.date>=fmtD(d7));}
  else if(currentTab==='month'){const ms=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;filtered=records.filter(r=>r.date.startsWith(ms));}
  else filtered=[...records];
  filtered.sort((a,b)=>a.date.localeCompare(b.date));
  if(!filtered.length){body.innerHTML=`<div class="empty-st"><span class="ei">📅</span><p>この期間の記録はまだないよ</p></div>`;return;}
  const avg=Math.round(filtered.reduce((s,r)=>s+r.pct,0)/filtered.length);
  body.innerHTML='';
  const sum=document.createElement('div');sum.className='summary-card';
  sum.innerHTML=`<div class="sum-left"><div class="sum-lbl">平均スコア</div><div class="sum-avg">${avg}%</div><div class="sum-days">${filtered.length}日分の記録</div></div><div class="sum-icon">${avg>=80?'🏆':avg>=60?'🔥':avg>=40?'💪':'🌱'}</div>`;
  body.appendChild(sum);
  const cs=document.createElement('div');
  let cd=filtered;
  if(currentTab==='all'&&filtered.length>14){
    const mo={};filtered.forEach(r=>{const k=r.date.substring(0,7);if(!mo[k])mo[k]=[];mo[k].push(r.pct);});
    cd=Object.entries(mo).map(([k,v])=>({date:k,pct:Math.round(v.reduce((s,x)=>s+x,0)/v.length),isGrouped:true}));
  }
  const cl=document.createElement('div');cl.className='chart-lbl';
  cl.textContent=currentTab==='week'?'直近7日間':currentTab==='month'?'今月の日別':'月別平均';
  cs.appendChild(cl);
  const bc=document.createElement('div');bc.className='bar-chart';
  cd.forEach(r=>{
    const col=document.createElement('div');col.className='bar-col';
    const bh=Math.max(3,Math.round((r.pct/100)*105));
    const c=r.pct>=80?'#ff5f6d':r.pct>=60?'#b8f050':r.pct>=40?'#ff9a3c':'#a855f7';
    const lbl=r.isGrouped?r.date.substring(5)+'月':fmtLbl(r.date);
    col.innerHTML=`<div class="bar-wrap"><div class="bar" style="height:${bh}px;background:${c};opacity:0.8;"><span class="bar-v">${r.pct}</span></div></div><div class="bar-lbl">${lbl}</div>`;
    bc.appendChild(col);
  });
  cs.appendChild(bc);body.appendChild(cs);
  const ll=document.createElement('div');ll.className='list-lbl';ll.textContent='日別ログ';body.appendChild(ll);
  const list=document.createElement('div');list.className='rec-list';
  [...filtered].reverse().forEach(r=>{
    const d=parseD(r.date);
    const item=document.createElement('div');item.className='rec-item';
    const sc=r.pct>=80?'#ff5f6d':r.pct>=60?'#b8f050':r.pct>=40?'#ff9a3c':'#606080';
    const tags=r.tasks?r.tasks.map(t=>`<span class="rec-tag ${t.done?'done':''}">${t.done?'✓ ':''}${t.name}</span>`).join(''):'';
    item.innerHTML=`<div class="rec-date"><div class="rec-mo">${d.getMonth()+1}月</div><div class="rec-day">${d.getDate()}</div><div class="rec-wd">${WEEKDAYS[d.getDay()]}</div></div><div class="rec-info"><div class="rec-tags">${tags}</div></div><div class="rec-score" style="color:${sc}">${r.pct}%</div>`;
    list.appendChild(item);
  });
  body.appendChild(list);
}

function fmtD(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtLbl(s){const d=parseD(s);return `${d.getMonth()+1}/${d.getDate()}\n${WEEKDAYS[d.getDay()]}`;}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goSetup(){showScreen('setup-screen');}
window.addEventListener('resize',()=>{if(document.getElementById('tracker-screen').classList.contains('active'))renderBubbles();});
initSetup();
</script>
</body>
</html>
